<meta name="keywords" content="Google Maps, Landing Pages, Marketing Local, Presença Digital, Google Meu Negócio, QR Code, NFC">

<style>
  /* ============== RESET & BASE ============== */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:80px}
  body{
    font-family:'Inter',sans-serif;
    background:#090d16;
    color:#94a3b8;
    line-height:1.6;
    overflow-x:hidden;
    min-height:100vh;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(129,140,248,0.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(129,140,248,0.04) 1px,transparent 1px);
    background-size:50px 50px;
    z-index:-2;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed;
    top:-20%;
    left:-10%;
    width:60%;
    height:60%;
    background:radial-gradient(circle,rgba(129,140,248,0.15) 0%,transparent 60%);
    z-index:-1;
    pointer-events:none;
    animation:floatGlow 12s ease-in-out infinite;
  }
  @keyframes floatGlow{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(20%,10%) scale(1.2)}
  }

  h1,h2,h3,h4{font-family:'Orbitron',sans-serif;color:#fff;line-height:1.2;font-weight:700}
  a{text-decoration:none;color:inherit}
  img{max-width:100%;display:block}
  ul{list-style:none}
  .container{width:min(1200px,92%);margin-inline:auto}

  /* ============== HEADER ============== */
  .header{
    position:fixed;
    top:0;left:0;right:0;
    z-index:1000;
    padding:14px 0;
    background:rgba(9,13,22,0.75);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(129,140,248,0.2);
    transition:all .3s ease;
  }
  .header.scrolled{
    background:rgba(9,13,22,0.9);
    border-bottom-color:rgba(129,140,248,0.4);
    box-shadow:0 4px 30px rgba(129,140,248,0.15);
  }
  .nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
  }
  .logo{
    font-family:'Orbitron',sans-serif;
    font-size:1.3rem;
    font-weight:900;
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
    letter-spacing:.5px;
  }
  .logo .icon-wrap{
    width:38px;height:38px;
    background:linear-gradient(135deg,#818cf8,#a855f7);
    border-radius:10px;
    display:grid;place-items:center;
    box-shadow:0 0 20px rgba(168,85,247,0.5);
    position:relative;
  }
  .logo .icon-wrap i{color:#fff;font-size:1.1rem}
  .logo .neon-text{
    background:linear-gradient(90deg,#818cf8,#fff,#c084fc);
    background-size:200% auto;
