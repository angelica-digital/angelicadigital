<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>{{titulo}}</title>
<meta name="description" content="{{descricao}}">
<!-- gerar:cabeca -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/portfolio.css">
<link rel="stylesheet" href="assets/cabecalho.css">
<script>document.documentElement.classList.add('js');</script>
</head>
<!-- Modelo das páginas de projeto (fonte/projeto.html). Não edite as páginas geradas:
     edite este arquivo e rode  node ferramentas/gerar-paginas.mjs
     Os dados de cada projeto ficam em assets/projetos.js. -->
<body data-base="/">

<header class="header cabecalho">
  <div class="container nav">
    <a href="index.html" class="logo" aria-label="Angélica Digital — início" data-i18n-attr="aria-label:cab.logo">
      <span class="icon-wrap"><i class="fa-solid fa-bolt"></i></span>
      <span class="label">Angélica Digital</span>
    </a>

    <button type="button" class="menu-botao" aria-expanded="false" aria-controls="menu-principal">
      <span data-i18n="cab.menu">Menu</span>
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <nav id="menu-principal" class="nav-links menu-principal" aria-label="Principal" data-i18n-attr="aria-label:cab.navPrincipal">
      <a href="vitrine.html" data-i18n="cab.vitrine">Vitrine</a>
      <a href="modelos.html" data-i18n="cab.modelos">Modelos de sites</a>
      <a href="index.html" data-i18n="cab.inicio">Início</a>
    </nav>
    <div class="seletor-idioma seletor-idioma--cabecalho" role="group" aria-label="Idioma" data-i18n-attr="aria-label:idioma.grupo">
      <button type="button" data-idioma="pt" lang="pt-BR" aria-label="Português">PT</button>
      <button type="button" data-idioma="es" lang="es" aria-label="Español">ES</button>
      <button type="button" data-idioma="en" lang="en" aria-label="English">EN</button>
    </div>
  </div>
</header>

<main id="projeto" data-slug="{{slug}}">
  <noscript><div class="container not-found"><p data-i18n="proj.semJs">Ative o JavaScript para ver este projeto.</p></div></noscript>
</main>

<footer class="footer">
  <div class="container">&copy; 2026 Angélica Digital · <a href="vitrine.html" data-i18n="rodape.voltarVitrine">Voltar à vitrine</a> · <a href="modelos.html" data-i18n="cab.modelos">Modelos de sites</a></div>
</footer>

<script src="assets/i18n-textos.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/cabecalho.js"></script>
<script src="assets/projetos.js"></script>
<script src="assets/componentes.js"></script>
</body>
</html>
